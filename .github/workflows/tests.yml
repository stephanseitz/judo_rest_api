name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      # Pinned: each release of the test package pins one Home Assistant
      # version, and the tests should not change under us overnight.
      - run: pip install pytest-homeassistant-custom-component==0.13.316
      - run: pytest
